services:
  - type: web
    name: outlet-photo-editor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FLASK_DEBUG
        value: "0"
    autoDeploy: true
